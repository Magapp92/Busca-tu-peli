# Despliegue en Netlify (buscatupeli.com)
#  - El front se sirve tal cual desde frontend/
#  - La API de Express corre como función (api/functions/api.js)
#  - Variables en Netlify → Site configuration → Environment variables:
#    MONGO_URI, ADMIN_KEY, JWT_SECRET y TMDB_TOKEN

[build]
  publish = "frontend"
  command = "npm ci --prefix api"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "api/functions"

# Cada lunes a las 6:00 (UTC) se regeneran las noticias de datos
[functions."noticias-semanales"]
  schedule = "0 6 * * 1"

# /buscatupeli/* → la función de la API (misma URL que en local)
[[redirects]]
  from = "/buscatupeli/*"
  to = "/.netlify/functions/api/buscatupeli/:splat"
  status = 200
  force = true

# Cabeceras de seguridad para todas las páginas
#  - CSP: solo se cargan recursos de la web, fuentes de Google, imágenes de TMDB y vídeos de YouTube
#    (la misma política que pone Express en local, en api/app.js)
#  - frame-ancestors / X-Frame-Options: nadie puede meter la web en un iframe (clickjacking)
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://image.tmdb.org https://i.ytimg.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"

# El panel de administración no se indexa en buscadores
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
