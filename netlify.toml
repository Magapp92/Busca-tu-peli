# Despliegue en Netlify (buscatupeli.com)
#  - El front se sirve tal cual desde frontend/
#  - La API de Express corre como función (api/functions/api.js)
#  - Variables en Netlify → Site configuration → Environment variables:
#    MONGO_URI, ADMIN_KEY y TMDB_TOKEN

[build]
  publish = "frontend"
  command = "npm ci --prefix api"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "api/functions"

# Cada lunes a las 6:00 (UTC) se regeneran las noticias de datos
[functions."noticias-semanales"]
  schedule = "0 6 * * 1"

# /buscatupeli/* → la función de la API (misma URL que en local)
[[redirects]]
  from = "/buscatupeli/*"
  to = "/.netlify/functions/api/buscatupeli/:splat"
  status = 200
  force = true
